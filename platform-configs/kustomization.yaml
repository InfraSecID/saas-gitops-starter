# platform-configs/kustomization.yaml — Kustomize root untuk Argo CD Projects, RBAC, dan ApplicationSet
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: platform-configs-kustomization

resources:
  - projects/appproject-basic.yaml
  - projects/appproject-pro.yaml
  - rbac/argocd-rbac-cm.yaml
  - rbac/tenant-roles.yaml
  - applicationsets/tenants-applicationset.yaml
