# workloads/base/secretstore.yaml — SecretStore External Secrets Operator terhubung ke AWS Secrets Manager via IRSA
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: tenant-aws-secretstore
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-1
      auth:
        jwt:
          serviceAccountRef:
            name: saas-backend-sa
