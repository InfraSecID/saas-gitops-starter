# workloads/base/externalsecret.yaml — ExternalSecret untuk menarik kredensial database tanpa simpan secret di Git
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: saas-backend-db-externalsecret
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: tenant-aws-secretstore
    kind: SecretStore
  target:
    name: saas-backend-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: "saas/tenants/shared/db-credentials"
        property: "connection_url"
