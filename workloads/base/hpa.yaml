# workloads/base/hpa.yaml — HorizontalPodAutoscaler untuk skalabilitas otomatis per tenant
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: saas-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: saas-backend
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
