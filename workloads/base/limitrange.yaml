# workloads/base/limitrange.yaml — LimitRange default untuk container di namespace tenant
apiVersion: v1
kind: LimitRange
metadata:
  name: tenant-limit-range
spec:
  limits:
    - type: Container
      default:
        cpu: "250m"
        memory: "256Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      max:
        cpu: "1000m"
        memory: "1Gi"
      min:
        cpu: "50m"
        memory: "64Mi"
