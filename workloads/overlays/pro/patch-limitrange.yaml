# workloads/overlays/pro/patch-limitrange.yaml — LimitRange kapasitas tinggi untuk container Tier Pro
apiVersion: v1
kind: LimitRange
metadata:
  name: tenant-limit-range
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "250m"
        memory: "256Mi"
      max:
        cpu: "2000m"
        memory: "2Gi"
      min:
        cpu: "100m"
        memory: "128Mi"
