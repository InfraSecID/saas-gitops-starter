# workloads/overlays/pro/kustomization.yaml — Overlay Kustomize untuk Tenant Tier Pro
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: workloads-overlay-pro

resources:
  - ../../base

patches:
  - path: patch-quota.yaml
  - path: patch-limitrange.yaml
  - path: patch-hpa.yaml
  - path: patch-externalsecret.yaml
  - path: patch-networkpolicy.yaml
